<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>日本之行小账本 · 06.22–07.03</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='16' fill='%23F05A28'/%3E%3Ccircle cx='24' cy='28' r='4' fill='%23FFFDF9'/%3E%3Ccircle cx='40' cy='28' r='4' fill='%23FFFDF9'/%3E%3Cpath d='M23 40 Q32 47 41 40' fill='none' stroke='%23FFFDF9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
:root {
  --bg: #EFECE5;
  --shell: #F7F4ED;
  --card: #FFFDF9;
  --well: #EAE4D7;
  --line: #DED6C6;
  --line-soft: #ECE6DA;
  --ink: #241F1C;
  --muted: #7B7267;
  --faint: #A3988C;
  --orange: #F05A28;
  --orange-b: #C44015;
  --yy: #2A9D68;
  --yy-soft: #E9F6EF;
  --lh: #2E6BE6;
  --lh-soft: #EBF2FF;
  --accent: var(--yy);
  --accent-soft: var(--yy-soft);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); min-height: 100%; }
body {
  padding: 10px 10px calc(32px + env(safe-area-inset-bottom));
}
@media (min-width: 640px) { body { padding: 24px 16px 48px; } }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* Outer Tactile Device Shell */
.shell {
  max-width: 680px;
  margin: 0 auto;
  background: var(--shell);
  border: 1.5px solid #D6CEBE;
  border-radius: 26px;
  padding: 12px 12px 18px;
  box-shadow: 0 14px 32px rgba(36, 31, 28, 0.08), inset 0 1.5px 0 rgba(255,255,255,0.9);
}
@media (min-width: 640px) { .shell { padding: 18px 20px 24px; border-radius: 30px; } }

/* Minimal Top Bar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 4px 10px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yy);
  transition: background 0.2s;
}
.status-dot.locked { background: var(--orange); }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.brand-date { font-size: 12px; color: var(--muted); font-weight: 500; }
.topbar-right { display: flex; gap: 6px; align-items: center; }

/* Tactile Mechanical Buttons */
.key {
  appearance: none;
  border: 1.5px solid #C8BFAE;
  border-bottom-width: 3.5px;
  background: linear-gradient(180deg, #FFFDF9 0%, #F1ECE0 100%);
  color: var(--ink);
  border-radius: 11px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  box-shadow: 0 2px 0 rgba(36, 31, 28, 0.08), inset 0 1px 0 rgba(255,255,255,0.95);
  transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.3, 1), border-bottom-width 0.06s, box-shadow 0.06s, background 0.14s, color 0.14s;
}
.key:active, .key.is-pressed {
  transform: translateY(2px) !important;
  border-bottom-width: 1.5px !important;
  box-shadow: inset 0 1px 2px rgba(36, 31, 28, 0.1) !important;
}
.key-sm {
  padding: 4px 10px;
  font-size: 11.5px;
  border-radius: 9px;
  border-bottom-width: 3px;
}
.key-primary {
  background: linear-gradient(180deg, #F57347 0%, var(--orange) 100%);
  border-color: var(--orange-b);
  color: #FFFDF9;
  box-shadow: 0 3px 0 rgba(196, 64, 21, 0.25), inset 0 1px 0 rgba(255,255,255,0.35);
}

/* Lock Screen */
.lock-stage {
  padding: 28px 6px 22px;
  display: flex;
  justify-content: center;
}
.lock-card {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 28px 22px 24px;
  text-align: center;
  box-shadow: 0 8px 22px rgba(36, 31, 28, 0.06), inset 0 1px 0 #fff;
}
.lock-card.shake { animation: shake 0.34s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  15%, 85% { transform: translateX(-4px); }
  30%, 70% { transform: translateX(5px); }
  45%, 55% { transform: translateX(-5px); }
}
.mascot {
  width: 64px;
  height: 64px;
  margin: 0 auto 14px;
  border-radius: 20px;
  background: #FAF3E5;
  border: 1.5px solid #E5D9C3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lock-title {
  font-size: 22px;
  font-weight: 750;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.lock-sub {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 18px;
}
.pass-slot {
  background: var(--well);
  padding: 5px;
  border-radius: 15px;
  border: 1px solid #CFC6B4;
  box-shadow: inset 0 2px 4px rgba(36,31,28,0.09);
  margin-bottom: 12px;
}
.pass-input {
  width: 100%;
  border: none;
  background: #FFFDF9;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
  text-align: center;
  outline: none;
  font-family: inherit;
}
.pass-input::placeholder { color: var(--faint); font-weight: 400; font-size: 13.5px; }
.unlock-btn { width: 100%; padding: 13px 16px; font-size: 15px; border-radius: 14px; border-bottom-width: 4px; }
.lock-err {
  margin-top: 10px;
  font-size: 12px;
  color: #C44015;
  background: #FFF2ED;
  border-radius: 10px;
  padding: 7px 10px;
}

/* Clean 3-Tab Switcher */
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: var(--well);
  padding: 5px;
  border-radius: 16px;
  border: 1px solid #CFC6B5;
  box-shadow: inset 0 2px 4px rgba(36, 31, 28, 0.08);
  margin-bottom: 12px;
}
.tab-btn {
  padding: 9px 6px;
  font-size: 13px;
  border-radius: 11px;
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  color: var(--muted);
}
.tab-btn.is-active {
  background: linear-gradient(180deg, #FFFFFF 0%, #FAF7EF 100%);
  border-color: #C7BCAE;
  border-bottom-width: 3px;
  color: var(--ink);
  box-shadow: 0 2px 6px rgba(36, 31, 28, 0.08), inset 0 1px 0 #fff;
}

/* Summary Card (Calm Warm Cream, Crisp Typography) */
.summary-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(36, 31, 28, 0.03), inset 0 1px 0 #fff;
}
.sum-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.sum-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.sum-figure {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.1;
  margin-top: 3px;
}
.sum-sub {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  align-items: center;
}
.dot-yy { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--yy); margin-right: 4px; vertical-align: 1px; }
.dot-lh { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lh); margin-right: 4px; vertical-align: 1px; }

/* Segmented Rocker (2-way or 3-way inside recessed track) */
.rocker {
  display: grid;
  gap: 5px;
  background: var(--well);
  padding: 4px;
  border-radius: 14px;
  border: 1px solid #CFC6B5;
  box-shadow: inset 0 1.5px 4px rgba(36,31,28,0.09);
  margin-bottom: 10px;
}
.rocker-2 { grid-template-columns: 1fr 1fr; }
.rocker-3 { grid-template-columns: repeat(3, 1fr); }
.rocker-opt {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  padding: 7px 6px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  transition: all 0.12s;
}
@media (min-width: 500px) {
  .rocker-opt.is-inline { flex-direction: row; justify-content: center; gap: 6px; padding: 8px 10px; }
}
.rocker-opt.is-on {
  background: #FFFDF9;
  border-color: #C7BCAE;
  border-bottom: 2.5px solid #B7AB9A;
  color: var(--ink);
  box-shadow: 0 2px 5px rgba(36,31,28,0.06);
}
.rocker-opt.is-on-yy { border-bottom-color: var(--yy); color: #16653E; }
.rocker-opt.is-on-lh { border-bottom-color: var(--lh); color: #1C4CB5; }
.rocker-opt:active { transform: translateY(1.5px); }
.rocker-amt { font-size: 11px; color: var(--muted); font-weight: 500; }
.rocker-opt.is-on .rocker-amt { color: inherit; opacity: 0.85; }

/* Compact Filter Strip */
.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 10px;
}
.h-scroll {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.h-scroll::-webkit-scrollbar { display: none; }
.chip {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 10px;
  border-bottom-width: 2.5px;
  flex-shrink: 0;
  font-weight: 550;
}
.chip.is-on {
  background: var(--ink);
  color: #FFFDF9;
  border-color: #151210;
  transform: translateY(1px);
  border-bottom-width: 1.5px;
}
.chip.is-dim { opacity: 0.38; }

.tool-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.search-slot {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 4px 9px;
}
.search-slot input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 12.5px;
  color: var(--ink);
  width: 100%;
  font-family: inherit;
  padding: 2px 0;
}
.search-slot input::placeholder { color: var(--faint); }
.x-btn {
  border: none;
  background: var(--well);
  color: var(--muted);
  border-radius: 50%;
  width: 18px;
  height: 18px;
  font-size: 12px;
  line-height: 18px;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}

/* Active Filter Status Line */
.list-status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 2px 4px 8px;
  font-size: 12px;
  color: var(--muted);
}
.list-status b { color: var(--ink); }

/* Donut + Tactile Joystick Card (Tab 2) */
.stats-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(36, 31, 28, 0.03), inset 0 1px 0 #fff;
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  align-items: center;
}
@media (min-width: 560px) {
  .stats-grid { grid-template-columns: 186px 1fr; gap: 18px; }
}
.donut-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.donut-wrap {
  position: relative;
  width: 172px;
  height: 172px;
}
.donut-svg { width: 100%; height: 100%; overflow: visible; }
.donut-slice {
  cursor: pointer;
  transition: stroke-width 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.16s;
}
.donut-slice.is-dimmed { opacity: 0.3; }
.donut-center {
  position: absolute;
  inset: 31px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px;
  pointer-events: none;
}
.dc-name { font-size: 11px; color: var(--muted); font-weight: 600; }
.dc-amt { font-size: 15.5px; font-weight: 800; color: var(--ink); margin: 1px 0; }
.dc-sub { font-size: 10.5px; color: var(--accent); font-weight: 650; }

/* Compact Tactile Joystick Puck */
.joy-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--well);
  border: 1px solid #CFC6B4;
  border-radius: 999px;
  padding: 4px 12px 4px 5px;
  box-shadow: inset 0 1.5px 4px rgba(36,31,28,0.1);
}
.joy-socket {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #302A26 0%, #1C1815 80%);
  border: 2px solid #BFB4A0;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.55);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  touch-action: none;
  user-select: none;
}
.joy-pip {
  position: absolute;
  font-size: 7px;
  color: rgba(255,255,255,0.42);
  cursor: pointer;
  padding: 2px;
  line-height: 1;
}
.joy-pip.up { top: 1px; left: 50%; transform: translateX(-50%); }
.joy-pip.down { bottom: 1px; left: 50%; transform: translateX(-50%); }
.joy-pip.left { left: 2px; top: 50%; transform: translateY(-50%); }
.joy-pip.right { right: 2px; top: 50%; transform: translateY(-50%); }
.joy-knob {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FF9675 0%, var(--orange) 60%, #BC3E15 100%);
  border: 1.5px solid #FAB8A2;
  box-shadow: 0 3px 6px rgba(0,0,0,0.42);
  cursor: grab;
  transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  touch-action: none;
}
.joy-knob.dragging { cursor: grabbing; transition: none; }
.joy-hint { font-size: 11px; color: var(--muted); font-weight: 550; line-height: 1.25; white-space: nowrap; }

/* Clean Category Legend Rows */
.legend {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.leg-btn {
  width: 100%;
  padding: 6px 10px;
  border-radius: 10px;
  border-bottom-width: 2.5px;
  justify-content: space-between;
  font-size: 12.5px;
}
.leg-btn.is-on {
  background: var(--ink);
  color: #FFFDF9;
  border-color: #151210;
}
.leg-l { display: flex; align-items: center; gap: 7px; }
.leg-dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
.leg-r { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.leg-pct { color: var(--muted); font-size: 11px; }
.leg-btn.is-on .leg-pct { color: rgba(255,255,255,0.72); }

/* Ratio Line */
.ratio-line {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--line-soft);
}
.ratio-track {
  height: 7px;
  border-radius: 999px;
  background: var(--well);
  overflow: hidden;
  display: flex;
  margin-bottom: 5px;
}
.ratio-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
}

/* Daily Bars (Tab 3) */
.bars-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 13px 14px;
  margin-bottom: 10px;
}
.bars-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
}
.daily-bars {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 4px;
  align-items: end;
  height: 114px;
}
.bar-btn {
  appearance: none;
  border: none;
  background: transparent;
  padding: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  cursor: pointer;
  touch-action: manipulation;
}
.bar-v { font-size: 8.5px; color: var(--muted); line-height: 1; }
.bar-track {
  width: 100%;
  max-width: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  border-radius: 5px;
  background: rgba(36, 31, 28, 0.04);
  overflow: hidden;
  border: 1px solid transparent;
}
.bar-btn.is-on .bar-track {
  border-color: var(--ink);
  box-shadow: 0 0 0 2px rgba(36,31,28,0.12);
}
.bar-d {
  font-size: 8.5px;
  letter-spacing: -0.04em;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
@media (min-width: 520px) { .bar-d, .bar-v { font-size: 10px; letter-spacing: 0; } }
.bar-btn.is-on .bar-d { color: var(--ink); font-weight: 800; }
.day-note {
  margin-top: 8px;
  padding: 7px 10px;
  border-radius: 10px;
  background: var(--well);
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

/* Clean Scannable Ledger List */
.tx-list {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
}
.tx-item {
  border-bottom: 1px solid var(--line-soft);
}
.tx-item:last-child { border-bottom: none; }
.tx-row-btn {
  width: 100%;
  appearance: none;
  border: none;
  background: transparent;
  padding: 11px 13px;
  text-align: left;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  touch-action: manipulation;
}
.tx-row-btn:active { background: #F5F1E8; }
.tx-left { min-width: 0; flex: 1; }
.tx-name {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  word-break: break-word;
}
.tx-meta {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
}
.tx-right { text-align: right; flex-shrink: 0; }
.tx-val { font-size: 14.5px; font-weight: 750; color: var(--ink); }
.tx-val.owe { color: #C9461E; }
.tx-val.ded { color: var(--yy); }
.tx-subval { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* Expanded Drawer inside Row or Receipt */
.tx-drawer {
  background: #F6F2E8;
  border-top: 1px dashed var(--line);
  padding: 9px 13px 11px;
  font-size: 12px;
  color: var(--muted);
}
.rec-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px dotted #DFD7C8;
}
.rec-row:last-child { border-bottom: none; }
.rec-row-name { color: var(--ink); font-weight: 550; }
.rec-footer {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  gap: 8px;
}
.link-btn {
  border: none;
  background: transparent;
  color: var(--lh);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 0;
  text-decoration: underline;
}
.empty {
  padding: 32px 14px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
.foot {
  text-align: center;
  font-size: 11px;
  color: var(--faint);
  margin-top: 12px;
}

/* Compact 4-way Sort Strip */
.sort-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding-bottom: 2px;
}

      for (let j = 0; j < 32; j++) t[j] ^= u[j];
    }
    const copyLen = Math.min(32, dkLen - pos);
    out.set(t.subarray(0, copyLen), pos);
    pos += copyLen;
  }

}
async function deriveKek(passBytes, saltBytes, iter, forcePure = false) {
  if (!forcePure && window.crypto && window.crypto.subtle) {
    try {
      const k = await window.crypto.subtle.importKey("raw", passBytes, "PBKDF2", false, ["deriveBits"]);
      const bits = await window.crypto.subtle.deriveBits({ name: "PBKDF2", salt: saltBytes, iterations: iter, hash: "SHA-256" }, k, 512);
      return new Uint8Array(bits);
    } catch (_) {}

}
function b64ToBytes(b64) {

  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

}
function bytesToB64(bytes) {

function eqConst(a, b) {

}
function ctrXor(key, iv, data) {

  const msg = new Uint8Array(iv.length + 4);
  msg.set(iv);
  const dv = new DataView(msg.buffer);
  const blocks = Math.ceil(data.length / 32);
  let pos = 0;
  for (let c = 0; c < blocks; c++) {
    dv.setUint32(iv.length, c, false);
    const ks = hmacSha256(key, msg);
    const chunk = Math.min(32, data.length - pos);
    for (let i = 0; i < chunk; i++) out[pos + i] = data[pos + i] ^ ks[i];

function decryptPayloadWithDek(dek) {
  const payEnc = hmacSha256(dek, encUtf8("payload-enc"));
  const payMac = hmacSha256(dek, encUtf8("payload-mac"));
  const iv = b64ToBytes(ENC_BILL.iv);
  const ct = b64ToBytes(ENC_BILL.ct);
  const tag = b64ToBytes(ENC_BILL.tag);
  if (!eqConst(hmacSha256(payMac, concatBytes(iv, ct)), tag)) return null;
  const pt = ctrXor(payEnc, iv, ct);
  return JSON.parse(decUtf8(pt));

async function tryUnlockWithAnswer(norm, forcePure = false) {
  const passBytes = encUtf8(PASS_PREFIX + norm);
  const dk = await deriveKek(passBytes, b64ToBytes(ENC_BILL.salt), ENC_BILL.iter, forcePure);
  const kekEnc = dk.subarray(0, 32), kekMac = dk.subarray(32, 64);
  for (const sl of ENC_BILL.slots) {
    const iv = b64ToBytes(sl.iv), w = b64ToBytes(sl.w), t = b64ToBytes(sl.t);
    if (eqConst(hmacSha256(kekMac, concatBytes(iv, w)), t)) {
      const dek = ctrXor(kekEnc, iv, w);
      const data = decryptPayloadWithDek(dek);
      if (data) return { dek, data };
    }
  }
  return null;
}

function computeTripStats(data) {
  const items = data.items;
  const lhPaid = items.filter(x => x.payer === "北河三").reduce((a, x) => a + x.rmb, 0);
  const yyPaid = items.filter(x => x.payer === "YY").reduce((a, x) => a + x.rmb, 0);
  const yyOwn = items.reduce((a, x) => a + x.yy, 0);
  const lhOwn = items.reduce((a, x) => a + x.lh, 0);
  const lhAdv = items.filter(x => x.payer === "北河三").reduce((a, x) => a + x.yy, 0);
  const yyAdv = items.filter(x => x.payer === "YY").reduce((a, x) => a + x.lh, 0);
  return {
    total: lhPaid + yyPaid,
    lhPaid, yyPaid, yyOwn, lhOwn, lhAdv, yyAdv,
    netYyToLh: lhAdv - yyAdv,
    dayIdx: Object.fromEntries(data.days.map((d, i) => [d.day, i]))
  };
}

const SoundFX = {
  enabled: localStorage.getItem("jp_sound_off") !== "1",
  ctx: null,
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
  },
  vibe(ms = 8) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (_) {} },
  click(mode = "light") {
    this.vibe(mode === "heavy" ? 13 : 6);
    if (!this.enabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const dur = mode === "heavy" ? 0.016 : 0.01;
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ch.length * 0.28));
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const bp = this.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = mode === "heavy" ? 1850 : 2700;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(mode === "heavy" ? 0.22 : 0.13, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(bp).connect(g).connect(this.ctx.destination); src.start(t);

      const osc = this.ctx.createOscillator(); const og = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(mode === "heavy" ? 180 : 250, t);
      osc.frequency.exponentialRampToValueAtTime(mode === "heavy" ? 70 : 105, t + 0.04);
      og.gain.setValueAtTime(mode === "heavy" ? 0.16 : 0.08, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
      osc.connect(og).connect(this.ctx.destination); osc.start(t); osc.stop(t + 0.05);
    } catch (_) {}
  },
  unlock() {
    this.vibe([12, 24, 16]);
    if (!this.enabled) return;
    try {
      this.init();
      [523.25, 659.25, 783.99].forEach((f, idx) => {
        const t = this.ctx.currentTime + idx * 0.06;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + 0.22);
      });
    } catch (_) {}
  },
  error() {
    this.vibe([22, 24, 22]);
    if (!this.enabled) return;
    try {
      this.init();
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(175, t); o.frequency.linearRampToValueAtTime(115, t + 0.13);
      g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + 0.16);
    } catch (_) {}
  }
};

function renderSortBar(curSort, attrName) {

function sortItemsOrGroups(list, sortKey, getAmt, getMinId, getMaxId) {
  const arr = [...list];

  return arr;
}

function groupReceipts(items, prefix) {
  const out = [], map = new Map();
  for (const it of items) {
    if (it.rec) {
      const k = `${prefix}::${it.day}::${it.cat}::${it.recFull}`;
      if (!map.has(k)) {
        const g = { isGroup: true, key: k, day: it.day, cat: it.cat, rec: it.rec, recFull: it.recFull, payer: it.payer, items: [] };
        map.set(k, g); out.push(g);
      }
      map.get(k).items.push(it);
    } else {
      out.push({ isGroup: false, key: `${prefix}::item::${it.id}`, item: it });
    }
  }
  return out;
}

const pShare = (it, who) => who === "yy" ? it.yy : it.lh;

function renderDonut(slices, selCat, total, whoLabel, selObj) {
  const cx = 86, cy = 86, r = 64, sw = 24, circ = 2 * Math.PI * r;
  let acc = 0;
  const arcs = total <= 0 ? `<circle cx="0" cy="0" r="${r}" fill="none" stroke="#DFD7C8" stroke-width="${sw}" />` :
    slices.map(sl => {
      const frac = sl.amt / total;
      const dash = Math.max(0, frac * circ - (slices.length > 1 ? 2.2 : 0));
      const off = -acc * circ;
      acc += frac;
      const on = selCat === sl.key;
      const dim = selCat !== "all" && !on;
      return `<circle class="donut-slice ${dim ? 'is-dimmed' : ''}" data-d-cat="${sl.key}" cx="0" cy="0" r="${r}" fill="none" stroke="${sl.color}" stroke-width="${on ? sw + 6 : sw}" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${off}" />`;
    }).join("");

  const label = selObj ? selObj.key : `${whoLabel} 个人总计`;
  const val = selObj ? selObj.amt : total;
  const sub = selObj ? `${((selObj.amt / (total || 1)) * 100).toFixed(1)}% · ${selObj.count}笔` : `${slices.reduce((a, x) => a + x.count, 0)} 笔`;

  return `
    <div class="donut-wrap">
      <svg class="donut-svg" viewBox="0 0 172 172" role="img" aria-label="消费分类圆环图">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EAE3D5" stroke-width="${sw}" />
        <g transform="translate(${cx}, ${cy}) rotate(-90)">${arcs}</g>
      </svg>
      <div class="donut-center">
        <div class="dc-name">${esc(label)}</div>
        <div class="dc-amt num">¥${fmt(val)}</div>
        <div class="dc-sub num">${esc(sub)}</div>
      </div>
    </div>
  `;
}

function stepPersonCat(slices, delta) {
  if (!slices.length) return;
  const order = ["all", ...slices.map(x => x.key)];
  const idx = Math.max(0, order.indexOf(state.person.cat));
  state.person.cat = order[(idx + delta + order.length) % order.length];
  SoundFX.click("heavy");
  renderPerson();
}

function bindJoystick(slices) {
  const socket = document.getElementById("joySocket");
  const knob = document.getElementById("joyKnob");
  if (!socket || !knob) return;

  socket.querySelectorAll("[data-joy]").forEach(pip => pip.addEventListener("click", (e) => {
    e.stopPropagation();
    const d = pip.dataset.joy;
    if (d === "left") stepPersonCat(slices, -1);
    else if (d === "right") stepPersonCat(slices, 1);
    else if (d === "up") { SoundFX.click("light"); state.person.cat = "all"; renderPerson(); }
    else if (d === "down") { SoundFX.click("heavy"); state.person.who = state.person.who === "yy" ? "lh" : "yy"; state.person.cat = "all"; syncTheme(); renderPerson(); }
  }));

  let active = false, sx = 0, sy = 0, fired = false;
  const MAX = 14, TH = 9;
  knob.addEventListener("pointerdown", (e) => {
    active = true; fired = false; sx = e.clientX; sy = e.clientY;
    knob.classList.add("dragging"); knob.setPointerCapture(e.pointerId); SoundFX.click("light");
  });
  knob.addEventListener("pointermove", (e) => {
    if (!active) return;
    let dx = e.clientX - sx, dy = e.clientY - sy;
    const dist = Math.hypot(dx, dy);
    if (dist > MAX) { dx = (dx / dist) * MAX; dy = (dy / dist) * MAX; }
    knob.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.95)`;
    if (!fired && dist >= TH) {
      fired = true;
      if (Math.abs(dx) >= Math.abs(dy)) stepPersonCat(slices, dx > 0 ? 1 : -1);
      else if (dy < 0) { SoundFX.click("heavy"); state.person.cat = "all"; renderPerson(); }
      else { SoundFX.click("heavy"); state.person.who = state.person.who === "yy" ? "lh" : "yy"; state.person.cat = "all"; syncTheme(); renderPerson(); }
    }
  });
  const rel = () => { if (!active) return; active = false; knob.classList.remove("dragging"); knob.style.transform = "translate3d(0,0,0) scale(1)"; };
  knob.addEventListener("pointerup", rel);
  knob.addEventListener("pointercancel", rel);
}

        <button type="button" class="key chip ${s.attr === 'all' ? 'is-on' : ''}" data-fam-attr="all">全部</button>
        <button type="button" class="key chip ${s.attr === 'aa' ? 'is-on' : ''}" data-fam-attr="aa">两人AA</button>
        <button type="button" class="key chip ${s.attr === 'yy' ? 'is-on' : ''}" data-fam-attr="yy">YY个人</button>
        <button type="button" class="key chip ${s.attr === 'lh' ? 'is-on' : ''}" data-fam-attr="lh">北河三个人</button>
        ${CATS.map(c => `<button type="button" class="key chip ${s.cat === c.key ? 'is-on' : ''}" data-fam-cat="${c.key}">${c.key}</button>`).join("")}
      </div>
      <div class="search-slot">
        <span style="font-size:12px;color:var(--faint);">搜</span>
        <input type="search" id="famQ" placeholder="搜全部行程消费…" value="${esc(s.q)}" />
        ${s.q ? `<button type="button" class="x-btn" id="famQClr">×</button>` : ""}
      </div>
      ${renderSortBar(s.sort, "fam-sort")}
    </div>

    <div class="list-status">
      <span>${grouped.length} 组 · ${filtered.length} 项</span>
      <span>合计 <b class="num">¥${fmt(filtSum)}</b></span>
    </div>

    <div class="tx-list">
      ${grouped.length === 0 ? `<div class="empty">当前条件下没有记录</div>` : grouped.map(renderFamilyEntry).join("")}
    </div>
  `;

  el.querySelectorAll("[data-fam-day]").forEach(b => b.addEventListener("click", () => {
    SoundFX.click("light"); s.day = (s.day === b.dataset.famDay) ? "all" : b.dataset.famDay; renderFamily();
  }));
  const cDay = document.getElementById("famClrDay");
  if (cDay) cDay.addEventListener("click", () => { SoundFX.click("light"); s.day = "all"; renderFamily(); });
  el.querySelectorAll("[data-fam-attr]").forEach(b => b.addEventListener("click", () => { SoundFX.click("light"); s.attr = b.dataset.famAttr; renderFamily(); }));
  el.querySelectorAll("[data-fam-cat]").forEach(b => b.addEventListener("click", () => {
    SoundFX.click("light"); s.cat = (s.cat === b.dataset.famCat) ? "all" : b.dataset.famCat; renderFamily();
  }));
  el.querySelectorAll("[data-fam-sort]").forEach(b => b.addEventListener("click", () => { SoundFX.click("heavy"); s.sort = b.dataset.famSort; renderFamily(); }));
  const fq = document.getElementById("famQ");
  fq.addEventListener("input", (e) => {
    const pos = e.target.selectionStart; s.q = e.target.value; renderFamily();
    const nx = document.getElementById("famQ"); if (nx) { nx.focus(); nx.setSelectionRange(pos, pos); }
  });
  const fqClr = document.getElementById("famQClr");
  if (fqClr) fqClr.addEventListener("click", () => { SoundFX.click("light"); s.q = ""; renderFamily(); });
  el.querySelectorAll("[data-fam-open]").forEach(b => b.addEventListener("click", () => {
    SoundFX.click("light"); const k = b.dataset.famOpen; s.openKeys[k] = !s.openKeys[k]; renderFamily();
  }));
}

function renderFamilyEntry(entry) {
  const open = !!state.family.openKeys[entry.key];
  if (!entry.isGroup) {
    const it = entry.item;
    const dot = it.payer === "北河三" ? `<span class="dot-lh"></span>` : `<span class="dot-yy"></span>`;
    const hasExtra = !!(it.sub || it.img || (it.jpy && it.jpy !== "—"));
    return `
      <div class="tx-item">
        <button type="button" class="tx-row-btn" data-fam-open="${esc(entry.key)}" aria-expanded="${open}">
          <div class="tx-left">
            <div class="tx-name">${esc(it.title)}</div>
            <div class="tx-meta"><span>${esc(it.day)}</span><span>${esc(it.cat)}</span><span>${dot}${esc(it.payer)}付</span></div>
          </div>
          <div class="tx-right">
            <div class="tx-val num">${fmtYen(it.rmb)}</div>
            <div class="tx-subval num">LH ${fmt(it.lh)} / YY ${fmt(it.yy)}</div>
          </div>
        </button>
        ${open && hasExtra ? `
          <div class="tx-drawer">
            ${it.jpy && it.jpy !== '—' ? `<div>日元：¥${esc(it.jpy)}</div>` : ''}
            ${it.sub ? `<div>说明：${esc(it.sub)}</div>` : ''}
            ${it.img ? `<div>小票号：${esc(it.img)}</div>` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }

  const sum = entry.items.reduce((a, x) => a + x.rmb, 0);
  const lhS = entry.items.reduce((a, x) => a + x.lh, 0);
  const yyS = entry.items.reduce((a, x) => a + x.yy, 0);
  return `
    <div class="tx-item">
      <button type="button" class="tx-row-btn" data-fam-open="${esc(entry.key)}" aria-expanded="${open}">
        <div class="tx-left">
          <div class="tx-name">${esc(entry.rec)} <span style="font-size:11.5px;color:var(--muted);font-weight:500;">(${entry.items.length}项 · ${open ? '收起' : '展开'})</span></div>
          <div class="tx-meta"><span>${esc(entry.day)}</span><span>${esc(entry.cat)}</span><span><span class="dot-lh"></span>${esc(entry.payer)}付</span></div>
        </div>
        <div class="tx-right">
          <div class="tx-val num">${fmtYen(sum)}</div>
          <div class="tx-subval num">LH ${fmt(lhS)} / YY ${fmt(yyS)}</div>
        </div>
      </button>
      ${open ? `
        <div class="tx-drawer">
          ${entry.items.map(it => `
            <div class="rec-row">
              <div style="min-width:0;">
                <div class="rec-row-name">${esc(it.title)}</div>
                <div style="font-size:11px;">LH ${fmt(it.lh)} / YY ${fmt(it.yy)}</div>
              </div>
              <div class="num" style="font-weight:700;flex-shrink:0;">${fmtYen(it.rmb)}</div>
            </div>
          `).join("")}
        </div>
      ` : ''}
    </div>
  `;
}

function renderActive() {
  if (!BILL_DATA) return;
  if (state.activeTab === "aa") renderAA();
  else if (state.activeTab === "person") renderPerson();
  else renderFamily();
}

/* Restore unlocked session cleanly if valid DEK exists in sessionStorage */
(function restoreSession() {
  sessionStorage.removeItem("jp_bill_unlocked");
  const saved = sessionStorage.getItem("jp_bill_dek");
  if (!saved) return;
  try {
    const data = decryptPayloadWithDek(b64ToBytes(saved));
    if (data) {
      BILL_DATA = data;
      SUMMARY = computeTripStats(BILL_DATA);
      setUnlocked(true, false);
      return;
    }
  } catch (_) {}
  sessionStorage.removeItem("jp_bill_dek");
})();
</script>
</body>
</html>
